# In-memory H2 database (RAM only, fresh every run)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Fake values: tests must never use real secrets
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-hs256
jwt.expiration=86400000
gemini.api.key=fake-key-for-tests
gemini.api.url=http://localhost/fake-gemini